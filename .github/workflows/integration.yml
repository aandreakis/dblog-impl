name: Integration rerun (on demand)

# Ad hoc rerun entry point for one Docker-backed lane. The full merge-gate
# verification lives in ci.yml and runs integrationTestDocker, e2eTestDocker,
# and compatibilityMatrix on PRs/pushes to main.

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Which Docker-backed lane to run
        required: true
        default: integrationTestDocker
        type: choice
        options:
          - integrationTestDocker
          - e2eTestDocker
          - compatibilityMatrix

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.lane }}
    runs-on: ubuntu-24.04
    # ubuntu-24.04 ships with Docker. macOS/Windows runners also carry Docker
    # Desktop but it is much slower to warm up, so this workflow pins Linux.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Docker is reachable
        run: docker ps

      - name: Run ${{ inputs.lane }}
        run: ./gradlew ${{ inputs.lane }} --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.lane }}-reports
          path: build/reports
          retention-days: 14
