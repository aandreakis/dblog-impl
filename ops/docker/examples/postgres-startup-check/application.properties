# Demo fixture — disposable credentials for local/compose use only.
# Do NOT reuse these values outside this bundled fixture stack.
#
# Example startup-check config for validating the Docker fixture-backed
# PostgreSQL source contract without launching the runtime request loop.

dblog.boot-mode=startup-check
dblog.runtime.state-path=/var/lib/dblog/state/runtime-state

dblog.source.adapter=postgres
dblog.source.id=postgres_startup_check_example
dblog.source.tables[0]=app.sample_orders
dblog.source.postgres.jdbc-url=jdbc:postgresql://postgres:5432/app
dblog.source.postgres.replication-jdbc-url=jdbc:postgresql://postgres:5432/app
dblog.source.postgres.database-name=app
dblog.source.postgres.username=dblog
dblog.source.postgres.password=dblog
dblog.source.postgres.publication-name=postgres_startup_check_pub
dblog.source.postgres.slot-name=postgres_startup_check_slot
dblog.source.postgres.reconnect-backoff=PT2S

dblog.sink.noop.enabled=true
