# Demo fixture — disposable credentials for local/compose use only.
# Do NOT reuse these values outside this bundled fixture stack.
#
# Example startup-check config for validating the Docker fixture-backed
# MySQL source plus PostgreSQL target contract without launching the runtime loop.

dblog.boot-mode=startup-check
dblog.runtime.state-path=/var/lib/dblog/state/runtime-state

dblog.source.adapter=mysql
dblog.source.id=mysql_startup_check_example
dblog.source.tables[0]=app.sample_orders
dblog.source.mysql.jdbc-url=jdbc:mysql://mysql:3306/app
dblog.source.mysql.username=dblog
dblog.source.mysql.password=dblog
dblog.source.mysql.hostname=mysql
dblog.source.mysql.port=3306
dblog.source.mysql.server-id=223504
dblog.source.mysql.reconnect-backoff=PT2S

dblog.target.enabled=true
dblog.target.dialect=POSTGRES
dblog.target.jdbc-url=jdbc:postgresql://postgres:5432/app
dblog.target.username=dblog
dblog.target.password=dblog
dblog.target.connection-timeout=PT2S
dblog.target.retry-backoff=PT2S
dblog.target.maximum-pool-size=4
