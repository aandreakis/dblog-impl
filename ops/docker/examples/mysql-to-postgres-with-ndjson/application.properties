# Demo fixture — disposable credentials for local/compose use only.
# Do NOT reuse these values outside this bundled fixture stack.
#
# Example packaged deployment config for the Docker-based
# MySQL -> DBLog -> PostgreSQL path with an additional NDJSON inspection sink.
#
# This is an example config, not a generic template for every DBLog deployment.

dblog.boot-mode=runtime
dblog.runtime.state-path=/var/lib/dblog/state/runtime-state

dblog.control-plane.enabled=true
# Bind inside the container so Docker can publish the host-facing control-plane
# port on localhost only via the packaged compose overlay. Host-side isolation
# (publish 127.0.0.1:8085) is what protects this endpoint; DBLog itself does
# not authenticate callers. The allow-non-loopback opt-in below is required
# because the default posture refuses non-loopback binds.
dblog.control-plane.host=0.0.0.0
dblog.control-plane.port=8085
dblog.control-plane.allow-non-loopback=true

dblog.source.adapter=mysql
dblog.source.id=mysql_packaged_example_ndjson
dblog.source.tables[0]=app.sample_orders
dblog.source.mysql.jdbc-url=jdbc:mysql://mysql:3306/app
dblog.source.mysql.username=dblog
dblog.source.mysql.password=dblog
dblog.source.mysql.hostname=mysql
dblog.source.mysql.port=3306
dblog.source.mysql.server-id=223503
dblog.source.mysql.retry-log-connection-loss=true
dblog.source.mysql.reconnect-backoff=PT2S

dblog.sink.ndjson.path=/var/lib/dblog/state/mysql-to-postgres-events.ndjson

dblog.target.enabled=true
dblog.target.dialect=POSTGRES
dblog.target.jdbc-url=jdbc:postgresql://postgres:5432/app
dblog.target.username=dblog
dblog.target.password=dblog
dblog.target.connection-timeout=PT2S
dblog.target.retry-backoff=PT2S
dblog.target.maximum-pool-size=4
