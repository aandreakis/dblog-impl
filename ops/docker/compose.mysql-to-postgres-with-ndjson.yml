# Example packaged deployment overlay for:
# MySQL -> DBLog -> PostgreSQL, plus an NDJSON inspection sink.
#
# This file layers on top of compose.yml, which owns the local database fixtures.
services:
  dblog:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - --spring.config.additional-location=file:/etc/dblog/application.properties
    ports:
      # Keep the operator-facing control plane local to the host even though
      # the container binds 0.0.0.0 internally.
      - "127.0.0.1:8085:8085"
    volumes:
      - ./examples/mysql-to-postgres-with-ndjson/application.properties:/etc/dblog/application.properties:ro
      - ./example-state/mysql-to-postgres-with-ndjson:/var/lib/dblog/state
